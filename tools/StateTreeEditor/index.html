<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Tree Editor</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <span class="brand">State Tree Editor</span>
    <span id="docTitle" class="doc-title"></span>
    <span class="spacer"></span>
    <button id="btnNew" title="New tree file">New</button>
    <button id="btnSave" title="Save (Ctrl+S)">Save</button>
    <button id="btnRevert" title="Reload the file from disk, dropping the changes">Revert</button>
    <span class="sep"></span>
    <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">Redo</button>
    <span class="sep"></span>
    <button id="btnSource" title="Show / edit the XML source (Ctrl+Shift+X)">XML</button>
    <button id="btnTheme" title="Dark / light theme">Theme</button>
    <button id="btnHelp" title="Keyboard shortcuts (F1)">?</button>
  </header>
  <aside id="files">
    <div class="panel-head">Files</div>
    <div class="files-tools">
      <input id="fileFilter" type="search" placeholder="Filter files (Ctrl+P)" spellcheck="false">
    </div>
    <div id="fileList" class="scroll"></div>
  </aside>
  <div class="splitter v" data-split="left"></div>
  <main id="outlinePanel">
    <div class="panel-head">
      <span>Outline</span>
      <span class="spacer"></span>
      <input id="outlineFind" type="search" placeholder="Find state / task" spellcheck="false">
      <button id="btnExpandAll" class="small" title="Expand all">+</button>
      <button id="btnCollapseAll" class="small" title="Collapse all">&minus;</button>
    </div>
    <div id="outline" class="scroll" tabindex="0"></div>
    <div id="source" class="hidden">
      <div class="source-bar">
        <span id="sourceInfo"></span>
        <span class="spacer"></span>
        <button id="btnSourceApply" title="Parse the text and use it (Ctrl+Enter)">Apply</button>
        <button id="btnSourceClose">Close</button>
      </div>
      <textarea id="sourceText" spellcheck="false" wrap="off"></textarea>
    </div>
  </main>
  <div class="splitter v" data-split="right"></div>
  <aside id="detailsPanel">
    <div class="panel-head"><span>Details</span></div>
    <div id="details" class="scroll"></div>
  </aside>
  <div class="splitter h" data-split="bottom"></div>
  <section id="problemsPanel">
    <div class="panel-head">
      <span>Problems</span>
      <span id="problemCounts"></span>
      <span class="spacer"></span>
      <label class="check"><input type="checkbox" id="showWarnings" checked> warnings</label>
      <label class="check"><input type="checkbox" id="showInfos" checked> infos</label>
    </div>
    <div id="problems" class="scroll"></div>
  </section>
</div>
<div id="menu" class="menu hidden"></div>
<div id="popup" class="popup hidden"></div>
<div id="toast" class="toast hidden"></div>
<div id="selftest" class="selftest hidden"></div>
<script src="editor.js"></script>
</body>
</html>
